decorators:
    - name: add
      schema:
        $id: root
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: false
        properties:
            num1:
                description: first number to be added
                type: number
            num2:
                description: second number to be added
                type: number
        required:
            - num1
            - num2
        type: object
    - name: addThree
      schema:
        $id: root
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: false
        properties:
            num1:
                description: first number to be added
                type: number
            num2:
                description: second number to be added
                type: number
            num3:
                description: third number to be added
                type: number
        required:
            - num1
            - num2
            - num3
        type: object
repositories:
    - name: maanas-python
      url: https://github.com/maanas-manjunath/pythonscripts.git
      reference: main
services:
    - name: add_2_numbers
      type: python-script
      description: Python script that adds 2 numbers
      filename: add.py
      repository: maanas-python
      decorator: add
    - name: add_3_numbers
      type: python-script
      description: Python script that adds 3 numbers
      filename: addThree.py
      repository: maanas-python
      decorator: addThree
    - name: run_command
      type: python-script
      description: Simulates Cisco device command execution without SSH connection
      filename: run_command.py
      repository: maanas-python
      decorator: run_command  
    - name: parseNetboxDevices
      type: python-script
      description: parse netbox devices response to a html report
      filename: generate_netbox_html.py
      repository: maanas-python
      decorator: htmlreport  
