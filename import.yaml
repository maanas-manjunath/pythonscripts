decorators:
    - name: add
      schema:
        $id: root
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: false
        properties:
            num1:
                description: first number to be added
                type: number
            num2:
                description: second number to be added
                type: number
        required:
            - num1
            - num2
        type: object
    - name: addThree
      schema:
        $id: root
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: false
        properties:
            num1:
                description: first number to be added
                type: number
            num2:
                description: second number to be added
                type: number
            num3:
                description: third number to be added
                type: number
        required:
            - num1
            - num2
            - num3
        type: object
    - name: helloansible
      schema:
        $id: root
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: false
        properties:
            my_name:
                description: user name
                type: string
            file_path:
                description: file path to store the welcome message
                type: string
        required:
            - my_name
            - file_path
        type: object
repositories:
    - name: maanas-python
      url: https://github.com/maanas-manjunath/pythonscripts.git
      reference: main
services:
    - name: add_2_numbers
      type: python-script
      description: Python script that adds 2 numbers
      filename: add.py
      repository: maanas-python
      decorator: add
    - name: add_3_numbers
      type: python-script
      description: Python script that adds 3 numbers
      filename: addThree.py
      repository: maanas-python
      decorator: addThree
    - name: Welcome Ansible
      type: ansible-playbook
      description: Creates a new file with a welcome message
      playbooks:
        - demo.yml
      working-directory: ./
      repository: maanas-python
      decorator: helloansible
      runtime:
        check: true
        diff: true
        verbose-level: 6
